<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2, h3 { color: #333; }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 5px;
            margin-top: 5px;
        }
        button:hover { background-color: #0056b3; }
        .search-box {
            background: #e9ecef;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            padding: 10px;
            background: #fff;
            margin-bottom: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
        }
        li:hover { background: #f0f0f0; }
    </style>
</head>
<body>

<div class="container">
    <h2>Formulário de Cadastro de Cliente</h2>
    
    <!-- Formulário de Cadastro -->
    <div class="form-group">
        <label for="clientId">ID (Código):</label>
        <input type="text" id="clientId" readonly placeholder="Gerado automaticamente">
    </div>
    <div class="form-group">
        <label for="clientNome">Nome:</label>
        <input type="text" id="clientNome">
    </div>
    <div class="form-group">
        <label for="clientEmail">E-mail:</label>
        <input type="email" id="clientEmail">
    </div>
    
    <button onclick="cadastrar_clientes()">Incluir Cliente</button>
    
    <!-- Seção de Busca -->
    <div class="search-box">
        <h3>Buscar Cliente</h3>
        <div class="form-group">
            <label for="searchQuery">Buscar por Nome ou ID:</label>
            <input type="text" id="searchQuery" placeholder="Digite o nome ou ID...">
        </div>
        <button onclick="buscarClienteDialogo()">Buscar</button>
    </div>

    <!-- Lista de Clientes -->
    <h3>Lista de Clientes (Clique para selecionar)</h3>
    <ul id="listaClientesVisual"></ul>
</div>

<script>
    // --- 1. Classe Cliente ---
    class Cliente {
        constructor(id, nome, email) {
            this.id = id;
            this.nome = nome;
            this.email = email;
        }

        // Método para converter os dados em JSON
        toJSON() {
            return {
                id: this.id,
                nome: this.nome,
                email: this.email
            };
        }
    }

    // --- 2. Limpeza do Arquivo no início do programa ---
    // Simula a limpeza do arquivo "clientes.json" limpando a chave correspondente no localStorage
    function limparArquivoInicial() {
        localStorage.setItem('clientes.json', JSON.stringify([]));
        console.log("Arquivo 'clientes.json' limpo com sucesso no início do programa.");
    }

    // --- 3. Salvar Clientes ---
    // Salva a lista de objetos no "arquivo" simulado
    function salvar_cliente(listaClientes) {
        localStorage.setItem('clientes.json', JSON.stringify(listaClientes));
        listar_clientes(); // Atualiza a interface gráfica
    }

    // --- 4. Inclusão de Clientes ---
    // Cria o objeto Cliente e adiciona à lista persistida
    function incluir_cliente(nome, email) {
        // Obter dados atuais do "arquivo"
        let dadosRaw = localStorage.getItem('clientes.json');
        let listaClientes = dadosRaw ? JSON.parse(dadosRaw) : [];

        // Gerar um ID incremental simples
        let novoId = (listaClientes.length + 1).toString();

        // Instanciar a classe Cliente
        let novoCliente = new Cliente(novoId, nome, email);

        // Adicionar o formato JSON do cliente à lista
        listaClientes.push(novoCliente.toJSON());

        // Salvar no "arquivo" clientes.json
        salvar_cliente(listaClientes);
        
        alert("Cliente cadastrado com sucesso!");
    }

    // --- 5. Entrada de Dados ---
    // Função chamada pelo botão do formulário para capturar e validar os múltiplos dados
    function cadastrar_clientes() {
        const nomeInput = document.getElementById('clientNome').value.trim();
        const emailInput = document.getElementById('clientEmail').value.trim();

        if (nomeInput === "" || emailInput === "") {
            alert("Por favor, preencha todos os campos (Nome e E-mail).");
            return;
        }

        // Executa a inclusão
        incluir_cliente(nomeInput, emailInput);

        // Limpa os campos do formulário para o próximo cadastro
        document.getElementById('clientId').value = "";
        document.getElementById('clientNome').value = "";
        document.getElementById('clientEmail').value = "";
    }

    // --- 6. Listagem de Clientes (Interface Gráfica) ---
    // Lê os dados salvos e exibe na tela
    function listar_clientes() {
        let dadosRaw = localStorage.getItem('clientes.json');
        let listaClientes = dadosRaw ? JSON.parse(dadosRaw) : [];
        
        const listaUI = document.getElementById('listaClientesVisual');
        listaUI.innerHTML = ""; // Limpa a lista visual atual

        listaClientes.forEach(cliente => {
            let li = document.createElement('li');
            li.textContent = `ID: ${cliente.id} | Nome: ${cliente.nome} | E-mail: ${cliente.email}`;
            
            // Requisito da Interface Gráfica: Seleção preenche o formulário automaticamente
            li.onclick = function() {
                selecionarClienteFormulario(cliente);
            };
            
            listaUI.appendChild(li);
        });
    }

    // Preenche o formulário ao clicar em um cliente da lista
    function selecionarClienteFormulario(cliente) {
        document.getElementById('clientId').value = cliente.id;
        document.getElementById('clientNome').value = cliente.nome;
        document.getElementById('clientEmail').value = cliente.email;
    }

    // --- 7. Caixa de Diálogo / Busca de Dados ---
    // Busca um cliente pelo Nome ou ID e exibe o resultado em um alert (caixa de diálogo)
    function buscarClienteDialogo() {
        const query = document.getElementById('searchQuery').value.trim().toLowerCase();
        
        if (query === "") {
            alert("Digite um nome ou ID para realizar a busca.");
            return;
        }

        let dadosRaw = localStorage.getItem('clientes.json');
        let listaClientes = dadosRaw ? JSON.parse(dadosRaw) : [];

        // Filtra buscando por correspondência exata do ID ou parcial do Nome
        let resultado = listaClientes.find(c => c.id === query || c.nome.toLowerCase().includes(query));

        if (resultado) {
            alert(`Cliente Encontrado:\n\nID: ${resultado.id}\nNome: ${resultado.nome}\nE-mail: ${resultado.email}`);
            // Opcional: auto-seleciona no formulário após encontrar na busca
            selecionarClienteFormulario(resultado);
        } else {
            alert("Nenhum cliente encontrado com esse nome ou ID.");
        }
    }

    // --- Execução Inicial ---
    // Executa a limpeza obrigatória assim que a página carrega
    window.onload = function() {
        limparArquivoInicial();
        listar_clientes();
    };
</script>

</body>
</html>
